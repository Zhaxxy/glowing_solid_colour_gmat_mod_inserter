
name: Build and Release EXE

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --clean --onefile --noconsole --add-data "icon.ico;." --add-data "lbp3ps4_glowing_solid_colour_gmat.json;." --icon="icon.ico" --name glowing_solid_colour_gmat_mod_inserter gui.py

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v${GITHUB_RUN_NUMBER}" dist/glowing_solid_colour_gmat_mod_inserter.exe \
            --title "glowing_solid_colour_gmat_mod_inserter v${GITHUB_RUN_NUMBER}" \
            --generate-notes \
            --target "${GITHUB_SHA}"
